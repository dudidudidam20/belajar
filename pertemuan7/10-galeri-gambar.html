<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>10 - Galeri Gambar - Sebelum</title>
    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f9f9f9;
            padding: 20px;
        }

        /* Gallery Styles */
        .gallery {
            display: grid; /* Gunakan CSS Grid */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* Kolom otomatis dengan lebar minimum 200px */
            gap: 15px; /* Jarak antar gambar */
        }

        .img-box {
            aspect-ratio: 1/1; /* Membuat kotak persegi */
            overflow: hidden; /* Memotong bagian gambar yang keluar dari kotak */
            border-radius: 8px; /* Membuat sudut membulat */
        }

        .img-box img {
            width: 100%; /* Gambar memenuhi lebar kotak */
            height: 100%; /* Gambar memenuhi tinggi kotak */
            object-fit: cover; /* Memastikan gambar tidak terdistorsi */
            filter: grayscale(100%); /* Gambar hitam putih secara default */
            transition: all 0.3s ease; /* Efek transisi saat hover */
        }

        .img-box img:hover {
            filter: grayscale(0); /* Mengembalikan warna saat hover */
            transform: scale(1.1); /* Membesarkan gambar sedikit saat hover */
        }
    </style>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Ubah class ".gallery" menjadi CSS Grid (grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))) dan beri gap.
    2. Pada elemen pembungkus gambar (.img-box), berikan properti aspect-ratio: 1/1 (agar selalu kotak), overflow: hidden, dan border-radius.
    3. Pada <img>, atur width: 100%, height: 100%, object-fit: cover agar gambar memenuhi kotak tanpa distorsi.
    4. Tambahkan filter: grayscale(100%) pada gambar agar berwarna hitam putih secara default, dan tambahkan efek transition.
    5. Saat di hover (img:hover), ubah filter menjadi grayscale(0) dan gunakan transform: scale(1.1) agar gambar membesar sedikit saat ditunjuk.
    -->
    <div class="gallery">
        <div class="img-box"><img src="Beautiful Landscape Of Mt Fuji With Chureito Pagoda Japan Photo _ JPG Free Download - Pikbest.jpeg" alt="Pemandangan 1"></div>
        <div class="img-box"><img src="download (2).jpeg" alt="Pemandangan 2"></div>
        <div class="img-box"><img src="IJEN BROMO TOUR FROM BALI CANGGU (3D2N).jpeg" alt="Pemandangan 3"></div>
        <div class="img-box"><img src="684617580898872260.jpeg" alt="Pemandangan 4"></div>
        <div class="img-box"><img src="1039487157721492892.jpeg" alt="Pemandangan 5"></div>
        <div class="img-box"><img src="1039487157762222945.jpeg" alt="Pemandangan 6"></div>
    </div>
</body>
</html>
