<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jurnal_umum_saddam</title>
    <link rel="stylesheet" href="jurnal_umum.css">
</head>
<body>
<div class="form-container">
        <h2>FORM INPUT JURNAL UMUM</h2>
        
        <form action="#" method="POST">
            <!-- Tanggal Transaksi -->
            <div class="form-group">
                <label for="tanggal">Tanggal Transaksi</label>
                <input type="date" id="tanggal" name="tanggal" required>
            </div>

            <!-- No. Bukti -->
            <div class="form-group">
                <label for="no_bukti">No. Bukti</label>
                <input type="text" id="no_bukti" name="no_bukti" placeholder="Masukkan nomor bukti transaksi" required>
            </div>

            <!-- Keterangan -->
            <div class="form-group">
                <label for="keterangan">Keterangan</label>
                <textarea id="keterangan" name="keterangan" placeholder="Masukkan keterangan transaksi" required></textarea>
            </div>

            <!-- Nama Akun -->
            <div class="form-group">
                <label for="nama_akun">Nama Akun</label>
                <select id="nama_akun" name="nama_akun" required>
                    <option value="" disabled selected>Pilih Nama Akun</option>
                    <option value="1101">1101 - Kas</option>
                    <option value="1102">1102 - Piutang Usaha</option>
                    <option value="4101">4101 - Pendapatan Jasa</option>
                    <option value="5101">5101 - Beban Gaji Karyawan</option>
                    <option value="5102">5102 - Beban Sewa Gedung</option>
                </select>
            </div>

            <!-- Posisi Saldo (Radio Button) -->
            <div class="form-group">
                <label>Posisi Saldo</label>
                <div class="radio-group">
                    <label><input type="radio" name="posisi_saldo" value="Debit" required> Debit</label>
                    <label><input type="radio" name="posisi_saldo" value="Kredit" required> Kredit</label>
                </div>
            </div>

            <!-- Nominal (Rp) -->
            <div class="form-group">
                <label for="nominal">Nominal (Rp)</label>
                <input type="number" id="nominal" name="nominal" placeholder="0" min="0" required>
            </div>

            <!-- Tombol Aksi -->
            <div class="form-actions">
                <button type="submit" class="btn">[ SIMPAN TRANSAKSI ]</button>
                <button type="reset" class="btn">[ BATAL ]</button>
            </div>
        </form>
    </div>
</body>
</html>
