<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laba_rugi_saddam</title>
    <link rel="stylesheet" href="laba_rugi.css">
</head>
<body>
    
    <div class="table-container">
        <div class="report-header">
            <h2>PT PRIMA AKUNTINDO</h2>
            <h3>LAPORAN LABA RUGI</h3>
            <p>Per 31 Oktober 2026</p>
        </div>

        <table class="financial-table">
            <thead>
                <tr>
                    <th style="width: 15%;">Kode</th>
                    <th style="width: 55%;">Keterangan Akun</th>
                    <th style="width: 30%;">Nominal (Rp)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="text-center">4101</td>
                    <td>Pendapatan Jasa</td>
                    <td class="text-right">120.000.000</td>
                </tr>
                <tr>
                    <td class="text-center">5101</td>
                    <td>Beban Gaji Karyawan</td>
                    <td class="text-right">30.000.000</td>
                </tr>
                <tr>
                    <td class="text-center">5102</td>
                    <td>Beban Sewa Gedung</td>
                    <td class="text-right">10.000.000</td>
                </tr>
                <tr>
                    <td class="text-center">5103</td>
                    <td>Beban Perlengkapan</td>
                    <td class="text-right">2.500.000</td>
                </tr>
                <tr class="total-row">
                    <td colspan="2" class="text-center">TOTAL LABA BERSIH</td>
                    <td class="text-right">77.500.000</td>
                </tr>
            </tbody>
        </table>
    </div>
    
</body>
</html>
